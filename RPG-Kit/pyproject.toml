[project]
name = "rpgkit-cli"
version = "0.1.2"
description = "RPG-Kit CLI - A tool to generate feature trees for repository planning and code generation."
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4",
    "pydantic>=2.0.0",
    "pytest",
    "tree-sitter",
    "tree-sitter-json",
    "networkx",
    "rank_bm25",
    "rapidfuzz",
    "libcst",
    "json5",
    "tiktoken",
    "tqdm",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0"
]

[project.scripts]
rpgkit = "rpgkit_cli:main"

[project.urls]
Repository = "https://github.com/Bonytu/RPG-Kit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpgkit_cli"]
